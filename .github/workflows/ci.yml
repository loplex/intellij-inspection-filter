name: ci
# Checks every push to main and every pull request: the tests, the Plugin Verifier, the UI tests in a real IDE, and
# the release rules of loplex/release-ci.
on:
  push:
    # Not the tags: publishing a release creates its tag, and the commit it names has been checked already.
    branches: [main]
  pull_request:
  # Started by release-publish.yml once a release has landed on main: a push made with GITHUB_TOKEN starts no run.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A pull request pushed again needs only its newest commit checked; main keeps a run for every commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Room for the IDE builds verifyPlugin downloads, one per release it checks against, made the way intellij/build
      # of release-ci makes it: the runner's Android, .NET and Haskell toolchains and docker images go, none of which
      # this job uses.
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false
      - uses: actions/checkout@v7
      # The JDK the plugin is compiled with, jvmToolchain(21), so that Gradle finds it rather than downloading one.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      # The open-source cache provider, as intellij/build of release-ci uses: the default one is a proprietary
      # component under Gradle's own terms of use.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew check
      # The check the Marketplace runs itself; it downloads each IDE build it checks against, and the free space
      # printed around it shows how much room that took.
      - run: df -h "$GITHUB_WORKSPACE" "$HOME"
      - run: ./gradlew verifyPlugin
      - if: always()
        run: df -h "$GITHUB_WORKSPACE" "$HOME"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The virtual display scripts/ui-tests.sh starts, and Openbox on it: without a window manager, nothing places
      # or focuses the IDE's windows.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb openbox
      - run: scripts/ui-tests.sh
      # The IDE's configuration, logs and reports, and the display's logs, for a run that went red.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests
          path: build/ui-tests
          if-no-files-found: ignore

  release-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The rules read the whole history and the tags; a shallow checkout passes them having compared nothing.
          fetch-depth: 0
      - uses: loplex/release-ci/check-release@v0.2.0
        with:
          source: gradle.properties
          checks: version changelog ancestry
