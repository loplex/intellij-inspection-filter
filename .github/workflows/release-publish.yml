name: release-publish
# Once a draft made by release.yml is published: carries the release back onto the default branch through
# loplex/release-ci, uploads the very archive the release carries to the JetBrains Marketplace, and says on the release
# where the Marketplace did not end up serving it.
on:
  release:
    types: [published]
# One run per release at a time: two runs for one release would race to land it.
concurrency:
  group: release-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  merge-back:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Asking for ci.yml by hand is a write to Actions, answered 403 without this.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: loplex/release-ci/release-flow/merge-back@v0.2.0
        id: back
        with:
          source: gradle.properties
          tag: ${{ github.event.release.tag_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          check-workflow: ci.yml
      # The accepted archive is the one the published draft carried, downloaded rather than built again.
      - id: accepted
        if: ${{ !cancelled() && steps.back.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir "$RUNNER_TEMP/accepted"
          archives=("$RUNNER_TEMP"/accepted/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::the release carries ${#archives[@]} archive(s), and publishing takes exactly one"
            exit 1
          fi
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"
      - uses: loplex/release-ci/intellij/publish@v0.2.0
        id: publish
        if: ${{ !cancelled() && steps.accepted.outcome == 'success' }}
        with:
          plugin-id: cz.loplex.ij-inspection-filter
          version: ${{ steps.back.outputs.version }}
          archive: ${{ steps.accepted.outputs.archive }}
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: loplex/release-ci/release-flow/warn@v0.2.0
        if: ${{ !cancelled() }}
        with:
          tag: ${{ github.event.release.tag_name }}
          outcome: ${{ steps.publish.outcome }}
          to: the JetBrains Marketplace
